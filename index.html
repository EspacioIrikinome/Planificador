<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0066cc">
    <title>Keto Meal Planner</title>
    <style>
        /* ============================================================
           RESET & VARIABLES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f6f8;
            --bg-card: #ffffff;
            --bg-card-alt: #f8f9fa;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a5a;
            --text-tertiary: #8a8a9a;
            --accent: #0066cc;
            --accent-hover: #0052a3;
            --accent-light: #ebf3fa;
            --green: #2d8f4e;
            --green-bg: #e6f2ea;
            --orange: #c97d2b;
            --orange-bg: #f5ede4;
            --red: #c0392b;
            --red-bg: #f0e4e2;
            --border: #e2e4e8;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --touch-size: 44px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111116;
                --bg-card: #1a1a22;
                --bg-card-alt: #22222a;
                --text-primary: #ededf0;
                --text-secondary: #9a9aaa;
                --text-tertiary: #6a6a7a;
                --border: #2a2a32;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 2px 12px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
                --accent-light: #0a1a2a;
                --green-bg: #1a2a22;
                --orange-bg: #2a221a;
                --red-bg: #2a1a1a;
            }
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: clamp(0.6rem, 2vw, 2.5rem) clamp(0.6rem, 2vw, 2rem);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ============================================================
           LANDING PAGE - SIN ICONOS
           ============================================================ */
        .landing-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
            padding: 1.5rem 1rem;
            animation: fadeIn 0.6s ease;
        }

        .landing-page.hidden {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .landing-logo {
            margin-bottom: 1.5rem;
        }

        .landing-logo-text {
            font-size: clamp(1.6rem, 5vw, 2.0rem);
            font-weight: 200;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .landing-logo-text span {
            color: var(--text-tertiary);
            font-weight: 400;
        }

        .landing-hero {
            max-width: 680px;
            margin-bottom: 1.5rem;
        }

        .landing-badge {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 0.6rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.8rem;
        }

        .landing-title {
            font-size: clamp(1.8rem, 6vw, 3.6rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.1;
            margin-bottom: 0.6rem;
        }

        .landing-title .highlight {
            color: var(--accent);
        }

        .landing-desc {
            font-size: clamp(0.9rem, 1.4vw, 1.15rem);
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.6;
            margin: 0 auto 0.5rem;
            padding: 0 0.5rem;
        }

        .landing-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1.5rem;
            width: 100%;
            max-width: 320px;
        }

        .landing-stats {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border);
            width: 100%;
            max-width: 350px;
            margin-top: 1rem;
        }

        .landing-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 60px;
        }

        .landing-stat .number {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .landing-stat .label {
            font-size: 0.6rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .landing-spacer {
            height: 1.5rem;
        }

        /* BOTÓN ENTRAR - ESTILO COHERENTE CON LA APP */
        .landing-btn-entrar {
            background: var(--bg);
            color: var(--green);
            border: none;
            padding: 0.85rem 3rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            box-shadow: 0 2px 16px rgba(0, 102, 204, 0.2);
            touch-action: manipulation;
            width: 100%;
            min-height: var(--touch-size);
            letter-spacing: 0.01em;
        }

        .landing-btn-entrar:hover {
            background: var(--bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(0, 102, 204, 0.3);
        }

        .landing-btn-entrar:active {
            transform: scale(0.98);
        }

        /* ============================================================
           APP CONTENT - SIN ICONOS
           ============================================================ */
        .app-content {
            display: none;
        }

        .app-content.visible {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: clamp(1rem, 3vw, 3rem);
            padding-bottom: clamp(0.8rem, 2vw, 2rem);
            border-bottom: 1px solid var(--border);
        }

        .app-title-group {
            display: flex;
            align-items: center;
            gap: clamp(0.4rem, 1.5vw, 1rem);
        }

        .app-title {
            font-size: clamp(1rem, 2.5vw, 1.6rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .app-subtitle {
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .header-action-link {
            font-size: clamp(0.75rem, 1.2vw, 0.85rem);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
            background: none;
            border: none;
            padding: 0.4rem 0.2rem;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1.5px;
            text-decoration-color: transparent;
            touch-action: manipulation;
            min-height: 36px;
            display: inline-flex;
            align-items: center;
        }

        .header-action-link:hover {
            color: var(--text-primary);
            text-decoration-color: var(--accent);
        }

        .header-action-link-primary {
            color: var(--accent);
            font-weight: 600;
        }

        .header-action-link-primary:hover {
            color: var(--accent-hover);
            text-decoration-color: var(--accent);
        }

        .header-action-link-danger {
            color: var(--red);
        }

        .header-action-link-danger:hover {
            color: var(--red);
            text-decoration-color: var(--red);
        }

        .header-action-divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            flex-shrink: 0;
        }

        /* ============================================================
           TABS
           ============================================================ */
        .tabs {
            display: flex;
            gap: 0.2rem;
            margin-bottom: clamp(1rem, 2.5vw, 2rem);
            background: var(--bg-card);
            padding: 0.2rem;
            border-radius: 40px;
            border: 1px solid var(--border);
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            padding: 0.5rem 0.8rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: clamp(0.65rem, 1.2vw, 0.8rem);
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
            touch-action: manipulation;
            min-height: 36px;
            flex: 1;
            text-align: center;
            min-width: 60px;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 10px rgba(0, 102, 204, 0.2);
        }

        .tab-content {
            display: none;
            animation: fadeSlide 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           WEEK GRID
           ============================================================ */
        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.8rem;
        }

        .day-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .day-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
        }

        .day-card-header {
            padding: 0.6rem 0.8rem;
            background: var(--bg-card-alt);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-name {
            font-weight: 600;
            font-size: clamp(0.7rem, 1vw, 0.8rem);
            color: var(--text-primary);
        }

        .day-body {
            padding: 0.6rem 0.8rem 0.8rem;
        }

        .meal-group {
            margin-bottom: 0.3rem;
            padding: 0.15rem 0.2rem;
            border-radius: 4px;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .meal-group:active {
            transform: scale(0.98);
        }

        .meal-group:hover {
            background: var(--bg-card-alt);
        }

        .meal-group:last-child {
            margin-bottom: 0;
        }

        .meal-group .click-hint {
            font-size: 0.4rem;
            color: var(--text-tertiary);
            opacity: 0.5;
            margin-left: 0.3rem;
        }

        .meal-label {
            font-size: clamp(0.4rem, 0.6vw, 0.45rem);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .meal-label .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .dot-bfast { background: var(--orange); }
        .dot-lunch1 { background: var(--green); }
        .dot-lunch2 { background: var(--accent); }
        .dot-dinner1 { background: var(--green); opacity: 0.6; }
        .dot-dinner2 { background: #5856d6; }

        .meal-name {
            font-size: clamp(0.6rem, 0.8vw, 0.7rem);
            color: var(--text-primary);
            line-height: 1.3;
            font-weight: 450;
        }

        .meal-macros {
            font-size: clamp(0.45rem, 0.6vw, 0.5rem);
            color: var(--text-tertiary);
            margin-top: 0.05rem;
        }

        .diversity-badge {
            display: inline-block;
            font-size: clamp(0.4rem, 0.5vw, 0.45rem);
            padding: 0.05rem 0.35rem;
            border-radius: 10px;
            margin-left: 0.2rem;
            font-weight: 600;
        }

        .diversity-badge.good {
            background: var(--green-bg);
            color: var(--green);
        }

        .diversity-badge.warning {
            background: var(--orange-bg);
            color: var(--orange);
        }

        .diversity-badge.bad {
            background: var(--red-bg);
            color: var(--red);
        }

        .day-summary {
            margin-top: 0.4rem;
            padding-top: 0.4rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            font-size: clamp(0.5rem, 0.6vw, 0.55rem);
            color: var(--text-secondary);
        }

        .day-summary strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* ============================================================
           CALENDARIO
           ============================================================ */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.6rem;
        }

        .calendar-week-label {
            grid-column: 1 / -1;
            font-size: clamp(0.8rem, 1.2vw, 0.9rem);
            font-weight: 600;
            color: var(--text-secondary);
            padding: 0.3rem 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 0.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .calendar-week-label .delete-week {
            background: var(--red-bg);
            color: var(--red);
            border: none;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: clamp(0.6rem, 0.8vw, 0.65rem);
            font-weight: 600;
            transition: var(--transition);
            min-height: 32px;
        }

        .calendar-week-label .delete-week:hover {
            background: var(--red);
            color: white;
        }

        .calendar-day {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 0.5rem;
            min-height: 100px;
            transition: var(--transition);
            overflow: hidden;
        }

        .calendar-day:hover {
            box-shadow: var(--shadow-md);
        }

        .calendar-day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;
            padding-bottom: 0.15rem;
            border-bottom: 1px solid var(--border);
        }

        .calendar-day-number {
            font-size: clamp(0.7rem, 0.9vw, 0.75rem);
            font-weight: 600;
            color: var(--text-primary);
        }

        .calendar-day-name {
            font-size: clamp(0.5rem, 0.7vw, 0.6rem);
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .calendar-meal {
            font-size: clamp(0.5rem, 0.6vw, 0.55rem);
            padding: 0.1rem 0.2rem;
            margin-bottom: 0.1rem;
            border-radius: 3px;
            background: var(--bg);
            border-left: 2px solid var(--accent);
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .calendar-meal:hover {
            background: var(--accent-light);
        }

        .calendar-meal .type {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: clamp(0.4rem, 0.5vw, 0.45rem);
            text-transform: uppercase;
        }

        .calendar-meal .name {
            color: var(--text-primary);
            font-size: clamp(0.45rem, 0.5vw, 0.5rem);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state-title {
            font-size: clamp(1rem, 1.5vw, 1.1rem);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
        }

        .empty-state-text {
            font-size: clamp(0.8rem, 1vw, 0.85rem);
            color: var(--text-secondary);
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.6rem;
            margin-bottom: clamp(1rem, 2.5vw, 2.5rem);
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.6rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            cursor: default;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: clamp(0.5rem, 0.6vw, 0.6rem);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            font-weight: 600;
        }

        .stat-value {
            font-size: clamp(1rem, 2vw, 1.8rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-top: 0.1rem;
            color: var(--text-primary);
        }

        .stat-bar {
            width: 100%;
            height: 3px;
            background: var(--border);
            border-radius: 4px;
            margin-top: 0.3rem;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
            background: var(--accent);
        }

        /* ============================================================
           MODAL DE RECETA - SIN ICONOS
           ============================================================ */
        .recipe-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: modalFadeIn 0.25s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .recipe-modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
            animation: modalSlideUp 0.3s ease;
            position: relative;
        }

        @keyframes modalSlideUp {
            from { transform: translateY(30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .recipe-modal-close {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: var(--bg);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .recipe-modal-close:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .recipe-modal-type {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .recipe-modal-title {
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            padding-right: 2rem;
        }

        .recipe-modal-macros {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding: 0.5rem 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .recipe-modal-macros span {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .recipe-modal-macros strong {
            color: var(--text-primary);
        }

        .recipe-modal-section {
            margin-bottom: 0.8rem;
        }

        .recipe-modal-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-tertiary);
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .recipe-modal-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .recipe-modal-ingredients {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .recipe-modal-ingredients li {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 0.2rem 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .recipe-modal-ingredients li:last-child {
            border-bottom: none;
        }

        .recipe-modal-ingredients li::before {
            content: "•";
            color: var(--accent);
            font-weight: bold;
        }

        .recipe-modal-footer {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
            font-size: 0.7rem;

        class AlertSystem {
            constructor() {
                this.toastContainer = this.createToastContainer();
                this.alertStyles = this.createAlertStyles();
                this.modalOverlay = null;
            }

            createToastContainer() {
                let container = document.getElementById('customToastContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'customToastContainer';
                    container.style.cssText = `
                        position: fixed;
                        bottom: 1rem;
                        right: 1rem;
                        left: 1rem;
                        z-index: 10000;
                        display: flex;
                        flex-direction: column;
                        gap: 0.75rem;
                        max-width: 400px;
                        width: auto;
                        margin: 0 auto;

                    `;
                    document.body.appendChild(container);
                }
                return container;
            }

            createAlertStyles() {
                const style = document.createElement('style');
                style.textContent = `
                    .custom-toast {

                        position: relative;
                        overflow: hidden;

                    .custom-toast.hide { transform: translateX(100%); opacity: 0; }
                    .custom-toast-content { flex: 1; min-width: 0; }
                    .custom-toast-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.1rem; color: var(--text-primary, #1a1a2e); }
                    .custom-toast-message { font-size: 0.75rem; color: var(--text-secondary, #4a4a5a); line-height: 1.4; }
                    .custom-toast-close { background: none; border: none; color: var(--text-tertiary, #8a8a9a); cursor: pointer; font-size: 1.2rem; padding: 0.2rem; flex-shrink: 0; transition: color 0.2s; font-family: inherit; line-height: 1; min-height: 32px; min-width: 32px; }
                    .custom-toast-close:hover { color: var(--text-primary, #1a1a2e); }

                    .custom-toast.info { border-left-color: var(--accent, #0066cc); background: var(--accent-light, #ebf3fa); }
                    .custom-toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--accent, #0066cc); transition: width 0.1s linear; }
                    .custom-toast.success .custom-toast-progress { background: var(--green, #2d8f4e); }
                    .custom-toast.error .custom-toast-progress { background: var(--red, #c0392b); }
                    .custom-toast.warning .custom-toast-progress { background: var(--orange, #c97d2b); }

                    .custom-modal-overlay {
                        position: fixed; top: 0; left: 0; right: 0; bottom: 0;

                        z-index: 99999; display: flex; align-items: center; justify-content: center;

            showToast(options) {
                const { message, title = '', type = 'info', duration = 4000, closable = true } = 
                    typeof options === 'string' ? { message: options } : options;
                const toast = document.createElement('div');
                toast.className = `custom-toast ${type}`;
                toast.setAttribute('role', 'alert');
                toast.innerHTML = `
                    <div class="custom-toast-content">
                        ${title ? `<div class="custom-toast-title">${title}</div>` : ''}
                        <div class="custom-toast-message">${message}</div>
                    </div>
                    ${closable ? `<button class="custom-toast-close" aria-label="Cerrar">&times;</button>` : ''}
                    <div class="custom-toast-progress" style="width:100%"></div>
                `;
                this.toastContainer.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));
                const progress = toast.querySelector('.custom-toast-progress');
                let startTime = Date.now();
                const updateProgress = () => {
                    const elapsed = Date.now() - startTime;
                    const remaining = Math.max(0, 1 - (elapsed / duration));
                    progress.style.width = `${remaining * 100}%`;
                    if (remaining > 0) requestAnimationFrame(updateProgress);
                };
                requestAnimationFrame(updateProgress);
                const closeBtn = toast.querySelector('.custom-toast-close');
                if (closeBtn) closeBtn.addEventListener('click', () => this.dismissToast(toast));
                const timeout = setTimeout(() => this.dismissToast(toast), duration);
                toast.dataset.timeout = timeout;
                return toast;
            }

            dismissToast(toast) {
                if (!toast || !toast.parentNode) return;
                toast.classList.remove('show');
                toast.classList.add('hide');
                if (toast.dataset.timeout) clearTimeout(parseInt(toast.dataset.timeout));
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 400);
            }

            showConfirm(options) {
                return new Promise((resolve) => {
                    const { title = 'Confirmar', message = '¿Estas seguro?', confirmText = 'Confirmar', cancelText = 'Cancelar', type = 'warning' } = options;
                    const overlay = document.createElement('div');
                    overlay.className = 'custom-modal-overlay';
                    overlay.innerHTML = `
                        <div class="custom-modal">
                            <div class="custom-modal-title">${title}</div>
                            <div class="custom-modal-message">${message}</div>
                            <div class="custom-modal-actions">
                                <button class="custom-modal-btn custom-modal-btn-secondary" data-action="cancel">${cancelText}</button>
                                <button class="custom-modal-btn ${type === 'danger' ? 'custom-modal-btn-danger' : 'custom-modal-btn-primary'}" data-action="confirm">${confirmText}</button>
                            </div>
                        </div>
                    `;
                    document.body.appendChild(overlay);
                    const confirmBtn = overlay.querySelector('[data-action="confirm"]');
                    const cancelBtn = overlay.querySelector('[data-action="cancel"]');
                    confirmBtn.focus();
                    const closeModal = (result) => { overlay.remove(); resolve(result); };
                    confirmBtn.addEventListener('click', () => closeModal(true));
                    cancelBtn.addEventListener('click', () => closeModal(false));
                    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(false); });
                    const handleKeydown = (e) => {
                        if (e.key === 'Escape') { closeModal(false); document.removeEventListener('keydown', handleKeydown); }
                        if (e.key === 'Enter' && e.target.closest('.custom-modal')) { closeModal(true); document.removeEventListener('keydown', handleKeydown); }
                    };
                    document.addEventListener('keydown', handleKeydown);
                });
            }

            success(message, title = 'Exito', duration = 3000) { return this.showToast({ message, title, type: 'success', duration }); }
            error(message, title = 'Error', duration = 4000) { return this.showToast({ message, title, type: 'error', duration }); }

            info(message, title = 'Informacion', duration = 3000) { return this.showToast({ message, title, type: 'info', duration }); }

            // ============================================================
            //  ALGORITMO CON MEMORIA DE INGREDIENTES Y PLATOS
            // ============================================================

            class AdvancedSelector {
                static extractCategories(plato) {
                    return extractIngredientCategories(plato);
                }

                static calculateDayScore(dayMeals) {
                    const allCategories = new Set();
                    const categoryCount = {};
                    let totalCategories = 0;

                    for (const meal of dayMeals) {
                        const cats = this.extractCategories(meal);
                        for (const cat of cats) {
                            allCategories.add(cat);
                            categoryCount[cat] = (categoryCount[cat] || 0) + 1;
                            totalCategories++;
                        }
                    }

                    const uniqueCount = allCategories.size;
                    const totalMeals = dayMeals.length;

                    let repetitionPenalty = 0;
                    for (const [cat, count] of Object.entries(categoryCount)) {
                        if (count > 1) {
                            repetitionPenalty += Math.pow(count, 2) * 15;
                        }
                    }

                    const varietyBonus = uniqueCount * 20;
                    const emptyMeals = dayMeals.filter(m => this.extractCategories(m).length === 0).length;
                    const emptyPenalty = emptyMeals * 10;

                    let severePenalty = 0;
                    for (const [cat, count] of Object.entries(categoryCount)) {
                        if (count >= 3) {
                            severePenalty += 30;
                        }
                    }

                    let score = varietyBonus - repetitionPenalty - emptyPenalty - severePenalty;
                    const maxScore = totalMeals * 20;
                    score = Math.max(0, Math.min(100, (score / maxScore) * 100));

                    return {
                        score: Math.round(score),
                        uniqueCount,
                        totalCategories,
                        repetitionPenalty,
                        categoryCount,
                        severePenalty
                    };
                }

                static seleccionarDiaCompleto(poolDesayunos, poolP1, poolP2, poolC1, poolC2) {
                    const ingredientesUsados = new Set();

                    const extraerCategorias = (plato) => {
                        if (!plato || !plato.ingredientes) return [];
                        const text = (plato.nombre + ' ' + plato.ingredientes.join(' ')).toLowerCase();
                        const encontrados = [];
                        for (const [categoria, keywords] of Object.entries(CONFIG.KEY_INGREDIENTS)) {
                            for (const keyword of keywords) {
                                if (text.includes(keyword)) {
                                    encontrados.push(categoria);
                                    break;
                                }
                            }
                        }
                        return encontrados;
                    };

                    const seleccionarPlato = (pool, usados, intentos = 0) => {
                        if (intentos > 100) {
                            return pool[Math.floor(Math.random() * pool.length)];
                        }

                        const scored = pool.map(plato => {
                            const ingredientes = extraerCategorias(plato);
                            let penalty = 0;
                            let nuevos = 0;

                            for (const ing of ingredientes) {
                                if (usados.has(ing)) {
                                    const vecesUsado = usados.has(ing) ? 2 : 1;
                                    penalty += Math.pow(vecesUsado, 2) * 25;
                                } else {
                                    nuevos++;
                                }
                            }

                            const repetidos = ingredientes.filter(ing => usados.has(ing));
                            const extraPenalty = repetidos.length * 15;
                            const bonus = nuevos * 20;

                            return {
                                plato,
                                score: bonus - penalty - extraPenalty,
                                ingredientes,
                                repetidos: repetidos.length
                            };
                        });

                        scored.sort((a, b) => b.score - a.score);

                        if (scored[0] && scored[0].repetidos >= 2 && intentos < 50) {
                            const index = pool.indexOf(scored[0].plato);
                            if (index > -1) {
                                const newPool = [...pool];
                                newPool.splice(index, 1);
                                if (newPool.length > 0) {
                                    return seleccionarPlato(newPool, usados, intentos + 1);
                                }
                            }
                        }

                        const topScore = scored[0] ? scored[0].score : -999;
                        const topCandidates = scored.filter(s => s.score >= topScore - 10);
                        const elegido = topCandidates[Math.floor(Math.random() * topCandidates.length)];

                        return elegido ? elegido.plato : pool[Math.floor(Math.random() * pool.length)];
                    };

                    const dPool = [...poolDesayunos];
                    const p1Pool = [...poolP1];
                    const p2Pool = [...poolP2];
                    const c1Pool = [...poolC1];
                    const c2Pool = [...poolC2];

                    const desayuno = seleccionarPlato(dPool, ingredientesUsados);
                    const ingDesayuno = extraerCategorias(desayuno);
                    ingDesayuno.forEach(ing => ingredientesUsados.add(ing));

                    const p1 = seleccionarPlato(p1Pool, ingredientesUsados);
                    const ingP1 = extraerCategorias(p1);
                    ingP1.forEach(ing => ingredientesUsados.add(ing));

                    const p2 = seleccionarPlato(p2Pool, ingredientesUsados);
                    const ingP2 = extraerCategorias(p2);
                    ingP2.forEach(ing => ingredientesUsados.add(ing));

                    const c1 = seleccionarPlato(c1Pool, ingredientesUsados);
                    const ingC1 = extraerCategorias(c1);
                    ingC1.forEach(ing => ingredientesUsados.add(ing));

                    const c2 = seleccionarPlato(c2Pool, ingredientesUsados);
                    const ingC2 = extraerCategorias(c2);
                    ingC2.forEach(ing => ingredientesUsados.add(ing));

                    return {
                        desayuno,
                        p1,
                        p2,
                        c1,
                        c2,
                        ingredientesUsados: Array.from(ingredientesUsados)
                    };
                }

                static seleccionarDiaCompletoConMemoriaSemanal(
                    poolDesayunos, poolP1, poolP2, poolC1, poolC2, platosUsadosSemana
                ) {
                    const nombresUsados = new Set(platosUsadosSemana);

                    const filtrarPool = (pool) => {
                        const filtrados = pool.filter(p => !nombresUsados.has(p.nombre));
                        return filtrados.length > 0 ? filtrados : pool;
                    };

                    const dPool = filtrarPool(poolDesayunos);
                    const p1Pool = filtrarPool(poolP1);
                    const p2Pool = filtrarPool(poolP2);
                    const c1Pool = filtrarPool(poolC1);
                    const c2Pool = filtrarPool(poolC2);

                    return this.seleccionarDiaCompleto(dPool, p1Pool, p2Pool, c1Pool, c2Pool);
                }

                static analyzeDayDiversity(dayMeals) {
                    return this.calculateDayScore(dayMeals);
                }
            }

            class KetoPlanner {
                constructor() {
                    this.calendario = [];
                    this.semanaActual = null;
                    this.loadFromStorage();
                }

                loadFromStorage() {
                    try {
                        const saved = localStorage.getItem(CONFIG.STORAGE_KEY);
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            this.calendario = Array.isArray(parsed) ? parsed : [];
                        }
                    } catch (error) {
                        console.error('Error loading calendar:', error);
                        this.calendario = [];
                    }
                }

                saveToStorage() {
                    try {
                        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.calendario));
                    } catch (error) {
                        console.error('Error saving calendar:', error);
                    }
                }

                generateWeek() {
                    let semana = [];
                    let totalK = 0,
                        totalP = 0,
                        totalC = 0,
                        totalG = 0;
                    let diversityScores = [];
                    const platosUsadosSemana = [];

                    for (let i = 0; i < 7; i++) {
                        const dia = AdvancedSelector.seleccionarDiaCompletoConMemoriaSemanal(
                            DESAYUNOS,
                            PRIMEROS_COMIDA,
                            SEGUNDOS_COMIDA,
                            PRIMEROS_CENA,
                            SEGUNDOS_CENA,
                            platosUsadosSemana
                        );

                        platosUsadosSemana.push(dia.desayuno.nombre);
                        platosUsadosSemana.push(dia.p1.nombre);
                        platosUsadosSemana.push(dia.p2.nombre);
                        platosUsadosSemana.push(dia.c1.nombre);
                        platosUsadosSemana.push(dia.c2.nombre);

                        const diaK = dia.desayuno.kcal + dia.p1.kcal + dia.p2.kcal + dia.c1.kcal + dia.c2.kcal;
                        const diaP = dia.desayuno.p + dia.p1.p + dia.p2.p + dia.c1.p + dia.c2.p;
                        const diaC = dia.desayuno.c + dia.p1.c + dia.p2.c + dia.c1.c + dia.c2.c;
                        const diaG = dia.desayuno.g + dia.p1.g + dia.p2.g + dia.c1.g + dia.c2.g;

                        totalK += diaK;
                        totalP += diaP;
                        totalC += diaC;
                        totalG += diaG;

                        const dayMeals = [dia.desayuno, dia.p1, dia.p2, dia.c1, dia.c2];
                        const diversity = AdvancedSelector.analyzeDayDiversity(dayMeals);
                        diversityScores.push(diversity.score);

                        semana.push({
                            dia: DIAS[i],
                            desayuno: dia.desayuno,
                            p1c: dia.p1,
                            p2c: dia.p2,
                            c1: dia.c1,
                            c2: dia.c2,
                            total: { kcal: diaK, p: diaP, c: diaC, g: diaG },
                            diversity: diversity,
                            ingredientesUsados: dia.ingredientesUsados
                        });
                    }

                    this.semanaActual = semana;

                    const avgDiversity = Math.round(diversityScores.reduce((a, b) => a + b, 0) / diversityScores.length);

                    const nextMonday = this._getNextMonday();
                    const semanaCalendario = {
                        id: Date.now(),
                        fechaInicio: nextMonday.toISOString(),
                        semana: semana,
                        stats: {
                            kcal: Math.round(totalK / 7),
                            p: Math.round(totalP / 7),
                            c: Math.round(totalC / 7),
                            g: Math.round(totalG / 7),
                            diversity: avgDiversity
                        }
                    };

                    this.calendario.push(semanaCalendario);
                    this.saveToStorage();

                    return semanaCalendario;
                }

                deleteWeek(id) {
                    this.calendario = this.calendario.filter(w => w.id !== id);
                    this.saveToStorage();
                    if (this.calendario.length > 0) {
                        const last = this.calendario[this.calendario.length - 1];
                        this.semanaActual = last.semana;
                    } else {
                        this.semanaActual = null;
                    }
                    return this.calendario;
                }

                clearAll() {
                    this.calendario = [];
                    this.semanaActual = null;
                    this.saveToStorage();
                }

                getLastWeek() {
                    if (this.calendario.length === 0) return null;
                    const last = this.calendario[this.calendario.length - 1];
                    return last.semana;
                }

                getWeekStats() {
                    if (this.calendario.length === 0) return null;
                    const last = this.calendario[this.calendario.length - 1];
                    return last.stats;
                }

                _getNextMonday() {
                    const now = new Date();
                    const day = now.getDay();
                    const diff = (day === 0 ? 1 : 8 - day);
                    const monday = new Date(now);
                    monday.setDate(now.getDate() + diff);
                    monday.setHours(0, 0, 0, 0);
                    return monday;
                }

                formatDate(date) {
                    const d = new Date(date);
                    return d.toLocaleDateString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });
                }

                getWeekNumber(date) {
                    const d = new Date(date);
                    d.setHours(0, 0, 0, 0);
                    d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
                    const week1 = new Date(d.getFullYear(), 0, 4);
                    return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                }

                analyzeWeek(semana) {
                    if (!semana) return null;

                    const allMeals = semana.flatMap(d =>
                        [d.desayuno, d.p1c, d.p2c, d.c1, d.c2]
                    );

                    const totalK = allMeals.reduce((sum, m) => sum + m.kcal, 0);
                    const totalP = allMeals.reduce((sum, m) => sum + m.p, 0);
                    const totalC = allMeals.reduce((sum, m) => sum + m.c, 0);
                    const totalG = allMeals.reduce((sum, m) => sum + m.g, 0);

                    const avgK = Math.round(totalK / 7);
                    const avgP = Math.round(totalP / 7);
                    const avgC = Math.round(totalC / 7);
                    const avgG = Math.round(totalG / 7);

                    const ratio = (avgG / (avgP + avgC)) * 100;

                    const allCategories = new Set();
                    for (const meal of allMeals) {
                        const cats = AdvancedSelector.extractCategories(meal);
                        for (const cat of cats) allCategories.add(cat);
                    }

                    return {
                        avgK,
                        avgP,
                        avgC,
                        avgG,
                        ratio: Math.round(ratio * 10) / 10,
                        totalK,
                        totalP,
                        totalC,
                        totalG,
                        meals: allMeals,
                        uniqueIngredients: allCategories.size
                    };
                }

                getMealClass(plato) {
                    if (!plato || !plato.nombre) return '';
                    const cats = AdvancedSelector.extractCategories(plato);
                    if (cats.includes('aguacate') && cats.includes('huevo')) return 'both';
                    if (cats.includes('aguacate')) return 'avocado';
                    if (cats.includes('huevo')) return 'egg';
                    return '';
                }
            }

                            const div = AdvancedSelector.analyzeDayDiversity(dayMeals);
                            divScore = div.score;
                        }
                        totalDiv += divScore;
                        diversityDetails.push({
                            dia: day.dia.nombre,

                            <div class="stat-value">${stats.avgG}g</div>

                html += `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:2rem;">
                        <div style="background:var(--bg-card);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border);">
                            <h3 style="margin-bottom:0.5rem;">Resumen Semanal</h3>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;">
                                <div><span style="color:var(--text-tertiary);">Calorías totales</span><br><strong>${stats.totalK}</strong></div>
                                <div><span style="color:var(--text-tertiary);">Proteína total</span><br><strong>${stats.totalP}g</strong></div>
                                <div><span style="color:var(--text-tertiary);">Carbohidratos totales</span><br><strong>${stats.totalC}g</strong></div>
                                <div><span style="color:var(--text-tertiary);">Grasa total</span><br><strong>${stats.totalG}g</strong></div>
                            </div>
                            <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);">
                                <span style="color:var(--text-tertiary);">Ratio Keto</span><br>
                                <strong style="font-size:1.3rem;color:var(--accent);">${stats.ratio}%</strong>
                                <span style="font-size:0.8rem;color:var(--text-secondary);margin-left:0.5rem;">
                                    (Grasa / (Proteína + Carbohidratos))
                                </span>
                            </div>
                        </div>
                        <div style="background:var(--bg-card);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border);">
                            <h3 style="margin-bottom:0.5rem;">Diversidad</h3>
                            <div style="margin-bottom:1rem;">
                                <span style="color:var(--text-tertiary);">Puntuación global</span><br>
                                <strong style="font-size:1.8rem;color:${avgDiversity > 70 ? 'var(--green)' : avgDiversity > 40 ? 'var(--orange)' : 'var(--red)'};">${avgDiversity}%</strong>
                                <span style="font-size:0.8rem;color:var(--text-secondary);margin-left:0.5rem;">
                                    ${avgDiversity > 70 ? 'Excelente' : avgDiversity > 40 ? 'Mejorable' : 'Pobre'}
                                </span>
                            </div>
                            <div style="margin-bottom:0.3rem;">
                                <span style="color:var(--text-tertiary);">Categorías únicas</span><br>
                                <strong>${stats.uniqueIngredients}</strong>
                                <span style="font-size:0.8rem;color:var(--text-secondary);margin-left:0.5rem;">
                                    de ${Object.keys(CONFIG.KEY_INGREDIENTS).length} posibles
                                </span>
                            </div>
                            <div style="margin-top:0.5rem;">
                                <span style="color:var(--text-tertiary);font-size:0.8rem;">Diversidad por día:</span>
                                <div style="display:flex;gap:0.3rem;margin-top:0.2rem;flex-wrap:wrap;">
                                    ${diversityDetails.map(d => `
                                        <span style="background:${d.score > 70 ? 'var(--green-bg)' : d.score > 40 ? 'var(--orange-bg)' : 'var(--red-bg)'};padding:0.1rem 0.4rem;border-radius:10px;font-size:0.6rem;font-weight:600;color:${d.score > 70 ? 'var(--green)' : d.score > 40 ? 'var(--orange)' : 'var(--red)'};">
                                            ${d.dia}: ${d.score}%
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                html += `
                    <div style="background:var(--bg-card);border-radius:var(--radius);padding:1.5rem;border:1px solid var(--border);">
                        <h3 style="margin-bottom:0.8rem;">Media Nutricional por Tipo de Comida</h3>
                        <div style="overflow-x:auto;">
                            <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                                <thead>
                                    <tr style="border-bottom:2px solid var(--border);">
                                        <th style="text-align:left;padding:0.5rem;">Tipo</th>
                                        <th style="text-align:right;padding:0.5rem;">Kcal</th>
                                        <th style="text-align:right;padding:0.5rem;">Proteína</th>
                                        <th style="text-align:right;padding:0.5rem;">Carbos</th>
                                        <th style="text-align:right;padding:0.5rem;">Grasa</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${avgByType.map(t => `
                                        <tr style="border-bottom:1px solid var(--border);">
                                            <td style="padding:0.5rem;font-weight:500;">${t.name}</td>
                                            <td style="text-align:right;padding:0.5rem;">${t.avgK}</td>
                                            <td style="text-align:right;padding:0.5rem;">${t.avgP}g</td>
                                            <td style="text-align:right;padding:0.5rem;">${t.avgC}g</td>
                                            <td style="text-align:right;padding:0.5rem;">${t.avgG}g</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                container.innerHTML = html;
            }

            // ============================================================
            //  RENDER MENÚ CON CLICK EN PLATOS
            // ============================================================

            function renderMenu(semana) {
                const grid = document.getElementById('weekGrid');

                let html = '';
                for (const d of semana) {
                    const divScore = d.diversity ? d.diversity.score : 0;
                    let badgeClass = 'bad';
                    let badgeText = 'Repetido ' + divScore + '%';
                    if (divScore > 70) { badgeClass = 'good';
                        badgeText = 'Diverso ' + divScore + '%'; } else if (divScore > 40) { badgeClass = 'warning';
                        badgeText = 'Mejorable ' + divScore + '%'; }

                    const ingredientesStr = d.ingredientesUsados ? d.ingredientesUsados.join(', ') : '';

                    const platos = [
                        { tipo: 'desayuno', label: 'Desayuno', dot: 'dot-bfast', plato: d.desayuno },
                        { tipo: 'p1c', label: '1º Comida', dot: 'dot-lunch1', plato: d.p1c },
                        { tipo: 'p2c', label: '2º Comida', dot: 'dot-lunch2', plato: d.p2c },
                        { tipo: 'c1', label: '1º Cena', dot: 'dot-dinner1', plato: d.c1 },
                        { tipo: 'c2', label: '2º Cena', dot: 'dot-dinner2', plato: d.c2 }
                    ];

                    html += `
                        <div class="day-card">
                            <div class="day-card-header">
                                <span class="day-name">${d.dia.nombre}</span>
                            </div>
                            <div class="day-body">
                    `;

                    for (const p of platos) {
                        html += `
                            <div class="meal-group" onclick="mostrarReceta(${JSON.stringify(p.plato).replace(/"/g, '&quot;')}, '${p.tipo}')" role="button" tabindex="0" aria-label="Ver receta de ${p.plato.nombre}">
                                <div class="meal-label">
                                    <span class="dot ${p.dot}"></span>${p.label}
                                    <span class="click-hint">👆</span>
                                </div>
                                <div class="meal-name">${p.plato.nombre}</div>
                                <div class="meal-macros">${mShort(p.plato)}</div>
                            </div>
                        `;
                    }

                    html += `
                                <div class="day-summary">
                                    <span>Kcal <strong>${d.total.kcal}</strong></span>
                                    <span>G <strong>${d.total.g}g</strong></span>
                                    <span>C <strong>${d.total.c}g</strong></span>
                                    <span>P <strong>${d.total.p}g</strong></span>
                                    <span class="diversity-badge ${badgeClass}">${badgeText}</span>
                                </div>
                                ${ingredientesStr ? '<div style="font-size:0.45rem;color:var(--text-tertiary);margin-top:0.15rem;">Ingredientes: ' + ingredientesStr + '</div>' : ''}
                            </div>
                        </div>
                    `;
                }

                grid.innerHTML = html;

                document.querySelectorAll('.meal-group[role="button"]').forEach(el => {
                    el.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            el.click();
                        }
                    });
                });
            }

            // ============================================================
            //  RENDER CALENDARIO
            // ============================================================

            function renderCalendario() {
                const grid = document.getElementById('calendarGrid');

                if (planner.calendario.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-title">Calendario vacío</div>
                            <div class="empty-state-text">Genera menús para verlos en el calendario</div>
                        </div>
                    `;
                    return;
                }

                let html = '';

                const sorted = [...planner.calendario].sort((a, b) =>
                    new Date(b.fechaInicio) - new Date(a.fechaInicio)
                );

                for (const entry of sorted) {
                    const fecha = new Date(entry.fechaInicio);
                    const weekNum = planner.getWeekNumber(fecha);
                    const fechaStr = planner.formatDate(fecha);

                    html += `
                        <div class="calendar-week-label">
                            <span>Semana ${weekNum} · Inicio: ${fechaStr}</span>
                            <button class="delete-week" onclick="eliminarSemana(${entry.id})">
                                Eliminar
                            </button>
                        </div>
                    `;

                    for (const d of entry.semana) {
                        const diaDate = new Date(fecha);
                        const dayIndex = DIAS.findIndex(dia => dia.nombre === d.dia.nombre);
                        diaDate.setDate(diaDate.getDate() + dayIndex);

                        const recetas = [
                            { type: 'Desayuno', plato: d.desayuno },
                            { type: '1º Comida', plato: d.p1c },
                            { type: '2º Comida', plato: d.p2c },
                            { type: '1º Cena', plato: d.c1 },
                            { type: '2º Cena', plato: d.c2 }
                        ];

                        html += `
                            <div class="calendar-day">
                                <div class="calendar-day-header">
                                    <span class="calendar-day-number">${diaDate.getDate()}</span>
                                    <span class="calendar-day-name">${d.dia.nombre}</span>
                                </div>
                                <div>
                                    ${recetas.map(r => `
                                        <div class="calendar-meal" onclick="mostrarReceta(${JSON.stringify(r.plato).replace(/"/g, '&quot;')}, '${r.type.toLowerCase().replace(' ', '')}')">
                                            <span class="type">${r.type}</span><br>
                                            <span class="name">${r.plato.nombre}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                }

                grid.innerHTML = html;
            }

            // ============================================================
            //  ACCIONES
            // ============================================================

            async function generarMenu() {
                if (planner.calendario.length >= CONFIG.MAX_WEEKS) {
                    await alertSystem.warning('Límite de ' + CONFIG.MAX_WEEKS + ' semanas alcanzado', 'Límite alcanzado');
                    return;
                }

                try {
                    const result = planner.generateWeek();
                    renderMenu(result.semana);
                    renderAnalisis(result.semana);
                    renderCalendario();
                    actualizarContador();

                    let totalDiv = 0;
                    for (const day of result.semana) {
                        if (day.diversity) totalDiv += day.diversity.score;
                    }
                    const avgDiv = Math.round(totalDiv / result.semana.length);

                    await alertSystem.success('Menú generado con diversidad ' + avgDiv + '%', 'Menú creado');
                } catch (error) {
                    console.error('Error generating menu:', error);
                    await alertSystem.error('Error al generar el menú. Inténtalo de nuevo.', 'Error');
                }
            }

            async function eliminarSemana(id) {
                const confirmed = await alertSystem.showConfirm({
                    title: 'Eliminar semana',
                    message: '¿Estás seguro de que quieres eliminar esta semana del planificador? Esta acción no se puede deshacer.',
                    confirmText: 'Eliminar',
                    cancelText: 'Cancelar',
                    type: 'danger'
                });
                
                if (confirmed) {
                    try {
                        planner.deleteWeek(id);
                        renderCalendario();
                        actualizarContador();
                        const semana = planner.getLastWeek();
                        if (semana) {
                            renderMenu(semana);
                            renderAnalisis(semana);
                        } else {
                            renderAnalisis(null);
                            document.getElementById('weekGrid').innerHTML = `
                                <div class="empty-state">
                                    <div class="empty-state-title">Genera tu menú</div>
                                    <div class="empty-state-text">Pulsa "Generar" para comenzar</div>
                                </div>
                            `;
                        }
                        await alertSystem.success('Semana eliminada correctamente', 'Eliminada');
                    } catch (error) {
                        await alertSystem.error('Error al eliminar la semana', 'Error');
                        console.error('Error:', error);
                    }
                }
            }

            async function limpiarTodo() {
                const confirmed = await alertSystem.showConfirm({
                    title: 'Limpiar todo',
                    message: 'Esta acción eliminará permanentemente TODAS las semanas guardadas. ¿Estás seguro?',
                    confirmText: 'Sí, limpiar todo',
                    cancelText: 'Cancelar',
                    type: 'danger'
                });
                
                if (confirmed) {
                    try {
                        planner.clearAll();
                        renderCalendario();
                        actualizarContador();
                        
                        document.getElementById('weekGrid').innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-title">Genera tu menú</div>
                                <div class="empty-state-text">Pulsa "Generar" para comenzar</div>
                            </div>
                        `;
                        renderAnalisis(null);
                        
                        await alertSystem.success('Todo ha sido limpiado correctamente', 'Limpiado');
                    } catch (error) {
                        await alertSystem.error('Error al limpiar los datos', 'Error');
                        console.error('Error:', error);
                    }
                }
            }

            // ============================================================
            //  TABS
            // ============================================================

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                    });
                    this.classList.add('active');
                    this.setAttribute('aria-selected', 'true');
                    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                    document.getElementById('tab-' + this.dataset.tab).classList.add('active');

                    if (this.dataset.tab === 'calendario') {
                        renderCalendario();
                    }
                    if (this.dataset.tab === 'analisis') {
                        const semana = planner.getLastWeek();
                        renderAnalisis(semana);
                    }
                });
            });

            // ============================================================
            //  EVENTOS
            // ============================================================

            document.getElementById('entrarBtn').addEventListener('click', function(e) {
                e.preventDefault();
                entrarApp();
            });

            document.getElementById('salirBtn').addEventListener('click', salirApp);
            document.getElementById('btnGenerar').addEventListener('click', generarMenu);
            document.getElementById('clearAllBtn').addEventListener('click', limpiarTodo);

            window.mostrarReceta = mostrarReceta;
            window.eliminarSemana = eliminarSemana;

            // ============================================================
            //  INIT
            // ============================================================

            actualizarContador();
            console.log('Keto Planner con modal de recetas al hacer click');

            if (planner.calendario.length > 0) {
                document.querySelector('#weeksCountLanding').textContent = planner.calendario.length;
                const semana = planner.getLastWeek();
                renderAnalisis(semana);
            }

            setTimeout(() => {
                alertSystem.info(
                    'Toca cualquier plato del menú para ver la receta completa con ingredientes y descripción.',
                    'Novedad: Recetas al hacer click'
                );
            }, 1500);

        })();
    </script>

</body>
</html>
